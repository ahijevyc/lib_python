[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ahijevyc"
version = "0.2"
description = "David Ahijevych's shared meteorology utilities (ATCF, MPAS, SPC, GLM, colormaps, ...)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
# Runtime deps (numpy, pandas, xarray, cartopy, metpy, ...) are managed by each conda env.
dependencies = []

[project.urls]
Homepage = "https://github.com/ahijevyc/lib_python"

[tool.setuptools]
packages = ["ahijevyc"]
